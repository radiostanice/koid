#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif "lo" accept

        # Allow established and related connections
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Allow IPv4 ICMP (ping) rate-limited
        ip protocol icmp limit rate 4/second accept

        # Allow essential ICMPv6 (Required for IPv6 NDP/SLAAC)
        # Do not rate-limit this broadly, or IPv6 connectivity will break
        ip6 nexthdr icmpv6 accept

        # Allow DHCP client (IPv4)
        udp dport { 67, 68 } accept

        # Allow DHCPv6 client (IPv6) - optional, but good for compatibility
        udp dport 546 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
