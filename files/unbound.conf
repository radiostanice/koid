server:
    # --- Runtime / privileges ---
    username: "_unbound"
    directory: "/etc/unbound"
    pidfile: "/run/unbound.pid"
    chroot: ""
    verbosity: 1                  # drop to 0 once you're happy
    log-queries: no
    log-replies: no

    # --- DNSSEC: strict validation, hard-fail on bogus ---
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-permissive-mode: no
    val-clean-additional: yes     # ← was the invalid "val-clean-extra"
    val-log-level: 1              # log *why* something was bogus
    ignore-cd-flag: yes           # clients can't ask us to skip validation
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-short-bufsize: yes
    harden-large-queries: yes
    use-caps-for-id: yes

    # --- Privacy ---
    qname-minimisation: yes
    pad-queries: yes
    hide-identity: yes
    hide-version: yes

    # --- Localhost-only listener ---
    interface: 127.0.0.1
    interface: ::1
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    deny-any: yes
    edns-buffer-size: 1232

    # --- THE line your config was missing: authenticate DoT upstreams ---
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    # --- Cache / availability ---
    minimal-responses: yes
    prefetch: yes
    serve-expired: yes            # serve stale while upstreams recover
    unwanted-reply-threshold: 10000

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: yes            # if ALL DoT upstreams are unreachable,
                                  # recurse ourselves instead of SERVFAIL
                                  # (still fully DNSSEC-validated)
    # Cloudflare + Quad9, authenticated via tls-cert-bundle
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    # Last-resort plaintext fallback. Uncomment ONLY if 853 is filtered on
    # this network. Integrity/authenticity stay enforced by DNSSEC;
    # only query confidentiality degrades while TLS upstreams are down.
    #forward-addr: 1.1.1.1
    #forward-addr: 9.9.9.9
